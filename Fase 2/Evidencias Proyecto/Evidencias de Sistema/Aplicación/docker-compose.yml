version: '3.8'
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: bd_capstone_sql
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=Capstone2026.Seguro!
    ports:
      - "1434:1433" # <-- AQUI ESTA EL CAMBIO: Tu PC usa el 1434, Docker internamente usa el 1433
    volumes:
      - sqlserver_data:/var/opt/mssql
volumes:
  sqlserver_data: